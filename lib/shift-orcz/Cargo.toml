[package]
name = "shift-orcz"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
once_cell = "1.21.3"
regex = "1.11.1"
reqwest = { version = "0.12.15", default-features = false }
scraper = { version = "0.23.1", default-features = false }
thiserror = "2.0.12"
time = { version = "0.3.41", features = [ "parsing", "macros" ] }
tokio = { version = "1.44.1", features = [ "rt" ] }

[dev-dependencies]
tokio = { version = "1.44.1", features = [ "macros" ] }

[features]
default = ["reqwest/rustls-tls"]

native-tls = ["reqwest/native-tls"]
rustls-tls = ["reqwest/rustls-tls"]

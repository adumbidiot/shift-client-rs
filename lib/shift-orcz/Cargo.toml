[package]
name = "shift-orcz"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
once_cell = "1.21.4"
regex = "1.12.3"
reqwest = { version = "0.13.2", default-features = false }
scraper = { version = "0.26.0", default-features = false }
thiserror = "2.0.18"
time = { version = "0.3.47", features = [ "parsing", "macros" ] }
tokio = { version = "1.50.0", features = [ "rt" ] }

[dev-dependencies]
tokio = { version = "1.50.0", features = [ "macros" ] }

[features]
default = ["reqwest/rustls"]

native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]

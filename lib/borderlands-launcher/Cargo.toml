[package]
name = "borderlands-launcher"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "generate-protobuf-files"
required-features = [ "generate-protobuf-files" ]

[dependencies]
async-compression = { version = "0.4.41", features = [ "tokio", "gzip" ], default-features = false }
bytes = { version = "1.11.1", default-features = false }
futures-util = { version = "0.3.32", default-features = false }
prost = "0.14.3"
reqwest = { version = "0.13.2", features = [ "gzip", "deflate", "stream" ], default-features = false }
thiserror = "2.0.18"
tokio = { version = "1.49.0", default-features = false }
tokio-util = { version = "0.7.18", features = [ "io" ], default-features = false }

# Optional
anyhow = { version = "1.0.102", optional = true }
prost-build = { version = "0.14.3", optional = true }

[dev-dependencies]
tokio = { version = "1.49.0", features = ["macros"] }

[features]
default = ["rustls"]

native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]

generate-protobuf-files = ["anyhow", "prost-build"]

[package]
name = "shift-client"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
once_cell = "1.21.4"
reqwest = { version = "0.13.2", default-features = false, features = [ "cookies", "json", "form", "query" ] }
scraper = { version = "0.26.0", default-features = false }
serde = { version = "1.0.228", features = [ "derive" ] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = [ "time" ] }

[dev-dependencies]
tokio = { version = "1.50.0", features = [ "macros" ] }

[features]
default = [ "reqwest/rustls" ]

native-tls = [ "reqwest/native-tls" ]
rustls = [ "reqwest/rustls" ]
